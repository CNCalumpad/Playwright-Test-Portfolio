$kind: http-request
name: 'API-002: POST To All Products List'
url: '{{baseUrl}}/api/productsList'
method: POST
scripts:
  - type: afterResponse
    code: |-
      // Steps follow API-002 in docs/API_TEST_CASES.md (step 1 is the request).
      // The server labels this JSON as text/html, so parse the body instead of
      // checking the Content-Type header.

      pm.test("Response body is valid JSON", function () {
          pm.expect(function () { pm.response.json(); }).not.to.throw();
      });

      const body = pm.response.json();

      pm.test("responseCode is 405", function () {
          pm.expect(body.responseCode).to.eql(405);
      });

      pm.test("Message says the request method is not supported", function () {
          pm.expect(body.message).to.eql("This request method is not supported.");
      });
    language: text/javascript
order: 2000
