$kind: http-request
name: "API-003: Get All Brands List"
url: "{{baseUrl}}/api/brandsList"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Steps follow API-003 in docs/API_TEST_CASES.md (step 1 is the request).

      pm.test("Response body is valid JSON", function () {
          pm.expect(function () { pm.response.json(); }).not.to.throw();
      });

      const body = pm.response.json();

      pm.test("responseCode is 200", function () {
          pm.expect(body.responseCode).to.eql(200);
      });

      pm.test("Brands list is not empty", function () {
          pm.expect(body.brands).to.be.an("array").that.is.not.empty;
      });

      pm.test("Each brand has id and name", function () {
          body.brands.forEach(function (brand) {
              pm.expect(brand).to.include.all.keys("id", "name");
          });
      });
    language: text/javascript
order: 3000
