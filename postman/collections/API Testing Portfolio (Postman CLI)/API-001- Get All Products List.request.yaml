$kind: http-request
name: 'API-001: Get All Products List'
url: '{{baseUrl}}/api/productsList'
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Steps follow API-001 in docs/API_TEST_CASES.md (step 1 is the request).

      pm.test("Response body is valid JSON", function () {
          pm.expect(function () { pm.response.json(); }).not.to.throw();
      });

      const body = pm.response.json();

      pm.test("responseCode is 200", function () {
          pm.expect(body.responseCode).to.eql(200);
      });

      pm.test("Products list is not empty", function () {
          pm.expect(body.products).to.be.an("array").that.is.not.empty;
      });

      pm.test("Each product has id, name, price, brand, and category", function () {
          body.products.forEach(function (product) {
              pm.expect(product).to.include.all.keys("id", "name", "price", "brand", "category");
          });
      });
    language: text/javascript
order: 1000
