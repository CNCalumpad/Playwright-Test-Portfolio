name: Playwright Tests
on:
  push:
    branches: [main, master, feat/contactForm, feat/login, feat/Register, feat/POM]
  pull_request:
    branches: [main, master, feat/contactForm, feat/login, feat/Register, feat/POM]

permissions:
  contents: write # needed so this workflow can push the snapshot commit and the report

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        id: run-tests
        continue-on-error: true # keep going so the snapshot still reflects a failure
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: npx playwright test --trace on
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Log in to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run Postman API tests
        id: api-tests
        continue-on-error: true # same as Playwright: let the snapshot/report steps still run
        # junit -> read by scripts/update-snapshot.js for the README snapshot.
        # html  -> published next to the Playwright report on GitHub Pages
        #          (/api/), and included in the uploaded artifact.
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          mkdir -p test-results playwright-report/api
          postman collection run "postman/collections/API Testing Portfolio (Postman CLI)" \
            --env-var "baseUrl=${BASE_URL:-https://automationexercise.com}" \
            -r cli,junit,html \
            --reporter-junit-export test-results/postman-junit.xml \
            --reporter-html-export playwright-report/api/index.html
      - name: Give the Postman report a fixed light background
        if: always()
        # The report sets no page background, so browsers or viewers that
        # paint the default one dark leave its dark text unreadable.
        # It also labels requests that send no body as an "unsupported
        # format"; requests that do send one (json, form, text) show it as-is.
        run: |
          report=playwright-report/api/index.html
          if [ -f "$report" ]; then
            sed -i 's|<meta charset="UTF-8">|&<meta name="color-scheme" content="light"><style>html, body { background: #fff; }</style>|' "$report"
            sed -i 's|Unable to load the request body due to an unsupported format\.\\nOpen the request in Postman to view\.|No request body|g' "$report"
          fi
      - name: Sync remote before updating the README snapshot and test case statuses
        run: |
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }} || git rebase --abort
      - name: Update README snapshot and test case statuses
        if: always()
        run: node scripts/update-snapshot.js
      - name: Commit updated README and docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update test snapshot [skip ci]"
          file_pattern: "README.md docs/TEST_CASES.md docs/API_TEST_CASES.md"
      - name: Deploy report to GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Fail the job if tests failed
        if: steps.run-tests.outcome == 'failure' || steps.api-tests.outcome == 'failure'
        run: exit 1
